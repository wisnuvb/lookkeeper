name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # honours the pinned, patched toolchain
      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Format, vet, staticcheck, govulncheck
        run: make check-fmt lint vuln
      - name: Unit tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["postgres:14-alpine", "postgres:17-alpine"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration and end-to-end tests
        env:
          LK_TEST_PG_IMAGE: ${{ matrix.postgres }}
        run: make test-integration
